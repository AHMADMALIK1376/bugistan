<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100vh; overflow: hidden;
            background: #1e1e1e;
            font-family: 'Georgia', serif;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36"><text y="32" font-size="32">🩴</text></svg>') 18 4, auto;
        }
        #area { display: flex; flex-direction: column; width: 100%; height: 100%; }
        #hdr {
            display: flex; justify-content: space-between; align-items: center;
            padding: 7px 12px;
            background: #2d2d2d;
            color: #FFD080; font-size: 13px; font-weight: bold; letter-spacing: 4px;
            border-bottom: 2px solid #FF6600; z-index: 10;
        }
        #hdr .title { flex: 1; text-align: center; }
        #bgSelector {
            background: #3a3a3a; color: #FFE0A0; border: 1px solid #555;
            padding: 3px 8px; border-radius: 4px; font-size: 11px;
            cursor: pointer; font-family: 'Georgia', serif;
        }
        #bgSelector:hover { background: #4a4a4a; }
        #info {
            text-align: center; padding: 4px 8px; font-size: 10px;
            color: #FFE0A0; background: #252525;
            border-bottom: 1px solid #444; z-index: 10; letter-spacing: 1px;
        }
        #info .red { color: #FF6060; }
        #info .yellow { color: #FFD040; }
        canvas { flex-grow: 1; display: block; }
    </style>
</head>
<body>
<div id="area">
    <div id="hdr">
        <span></span>
        <span class="title">🐛 BUG HUNT 🩴</span>
        <select id="bgSelector">
            <option value="mud">🪵 Mud Ground</option>
            <option value="grass">🌿 Grass Field</option>
            <option value="night">🌙 Night Sky</option>
            <option value="desert">🏜️ Desert Sand</option>
            <option value="ocean">🌊 Ocean Deep</option>
            <option value="space">🚀 Space</option>
        </select>
    </div>
    <div id="info">
        <span class="red">🔴 Errors: <b id="errCount">0</b></span> |
        <span class="yellow">🟡 Warnings: <b id="warnCount">0</b></span> |
        🩴 Killed: <b id="kc">0</b> | ⚡ Combo: <b id="combo">0</b>
    </div>
    <canvas id="c"></canvas>
</div>

<!-- MUD THEME -->
<script src="bugs/mud/mud-dauber.js"></script>
<script src="bugs/mud/mayfly.js"></script>
<script src="bugs/mud/dragonfly.js"></script>
<script src="bugs/mud/mole-cricket.js"></script>
<script src="bugs/mud/water-scorpion.js"></script>
<script src="bugs/mud/crane-fly.js"></script>
<script src="bugs/mud/marsh-beetle.js"></script>

<!-- GRASS THEME -->
<script src="bugs/grass/grasshopper.js"></script>
<script src="bugs/grass/beetle.js"></script>
<script src="bugs/grass/ladybug.js"></script>
<script src="bugs/grass/caterpillar.js"></script>
<script src="bugs/grass/armyworm.js"></script>
<script src="bugs/grass/flea.js"></script>
<script src="bugs/grass/leafhopper.js"></script>

<!-- NIGHT THEME -->
<script src="bugs/night/moth.js"></script>
<script src="bugs/night/firefly.js"></script>
<script src="bugs/night/spider.js"></script>
<script src="bugs/night/stonefly.js"></script>
<script src="bugs/night/glowworm.js"></script>
<script src="bugs/night/mosquito.js"></script>

<!-- DESERT THEME -->
<script src="bugs/desert/namib-beetle.js"></script>
<script src="bugs/desert/silver-ant.js"></script>
<script src="bugs/desert/desert-locust.js"></script>
<script src="bugs/desert/darkling-beetle.js"></script>
<script src="bugs/desert/dune-cricket.js"></script>
<script src="bugs/desert/scarab.js"></script>
<script src="bugs/desert/antlion.js"></script>
<script src="bugs/desert/sand-wasp.js"></script>

<!-- OCEAN THEME -->
<script src="bugs/ocean/fish.js"></script>
<script src="bugs/ocean/jellyfish.js"></script>
<script src="bugs/ocean/crab.js"></script>
<script src="bugs/ocean/seahorse.js"></script>
<script src="bugs/ocean/turtle.js"></script>
<script src="bugs/ocean/shark.js"></script>

<!-- SPACE THEME -->
<script src="bugs/space/alien.js"></script>
<script src="bugs/space/robot-bug.js"></script>
<script src="bugs/space/ufo.js"></script>
<script src="bugs/space/space-worm.js"></script>

<!-- THEME REGISTRY -->
<script src="bugs/theme-registry.js"></script>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const errCountEl = document.getElementById('errCount');
const warnCountEl = document.getElementById('warnCount');
const kc = document.getElementById('kc');
const comboEl = document.getElementById('combo');
const bgSelector = document.getElementById('bgSelector');

let W, H, frame = 0;
let mouse = { x: -999, y: -999 };
let bugs = [], killed = 0;
let errorTarget = 0, warningTarget = 0;
let combo = 0, comboTimer = 0, particles = [];
let currentBackground = 'mud';

bgSelector.addEventListener('change', () => {
    currentBackground = bgSelector.value;
    setTheme(currentBackground);
    // Clear all bugs and respawn with new theme creatures
    bugs.forEach(b => b.alive = false);
    bugs = [];
    const tot = errorTarget + warningTarget;
    for (let i = 0; i < tot; i++) {
        bugs.push(new Bug(undefined, i >= errorTarget));
    }
    updateCountDisplay();
});

function resize() { W = canvas.width = canvas.clientWidth; H = canvas.height = canvas.clientHeight; }
window.addEventListener('resize', resize);
canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });

class Bug {
    constructor(type, isWarning) {
        this.type = type !== undefined ? type : Math.floor(Math.random() * bugTypes.length);
        this.bug = bugTypes[this.type];
        this.isWarning = isWarning || false;
        this.canFly = this.bug.canFly !== undefined ? this.bug.canFly : true;
        this.x = 30 + Math.random() * (W - 60);
        this.y = 30 + Math.random() * (H - 60);
        this.vx = (Math.random() - 0.5) * this.bug.speed;
        this.vy = (Math.random() - 0.5) * this.bug.speed;
        this.size = this.isWarning ? this.bug.size * 0.7 + Math.random() * 3 : this.bug.size + Math.random() * 4;
        this.alive = true;
        this.legPhase = Math.random() * Math.PI * 2;
        this.antennaPhase = Math.random() * Math.PI * 2;
        this.wingPhase = Math.random() * Math.PI * 2;
        this.fleeTimer = 0;
        this.wobble = Math.random() * Math.PI * 2;
        this.trail = [];
    }

    update() {
        if (!this.alive) return;
        const dx = mouse.x - this.x, dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const fleeing = dist < 90;
        if (fleeing) { this.fleeTimer = 25; this.vx -= (dx / dist) * 0.6; this.vy -= (dy / dist) * 0.6; }
        if (this.fleeTimer > 0) this.fleeTimer--;
        this.x += this.vx; this.y += this.vy;
        this.wobble += 0.06; this.legPhase += 0.28 * this.bug.speed;
        this.antennaPhase += 0.12; this.wingPhase += 0.35;
        const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        if (spd > this.bug.speed * 2.5) { this.vx *= 0.88; this.vy *= 0.88; }
        if (this.x < 12 || this.x > W - 12) this.vx *= -1;
        if (this.y < 12 || this.y > H - 12) this.vy *= -1;
        this.x = Math.max(12, Math.min(W - 12, this.x));
        this.y = Math.max(12, Math.min(H - 12, this.y));
        if (Math.random() < 0.006 && !fleeing) { this.vx = (Math.random() - 0.5) * this.bug.speed; this.vy = (Math.random() - 0.5) * this.bug.speed; }
        if (fleeing) { this.trail.push({ x: this.x, y: this.y, a: 0.35 }); if (this.trail.length > 6) this.trail.shift(); for (let t of this.trail) t.a -= 0.04; }
    }

    draw(ctx) {
        if (!this.alive) return;
        for (let t of this.trail) { ctx.save(); ctx.globalAlpha = Math.max(0, t.a); ctx.fillStyle = this.isWarning ? '#FFD040' : '#88FFAA'; ctx.beginPath(); ctx.arc(t.x, t.y, this.size * 0.25, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
        ctx.save(); ctx.translate(this.x, this.y);
        const s = this.size, angle = Math.atan2(this.vy, this.vx);
        ctx.rotate(angle + Math.PI / 2);
        const bob = Math.sin(this.wobble) * 1.2, fleeing = this.fleeTimer > 0;
        ctx.save(); ctx.rotate(-(angle + Math.PI / 2));
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.ellipse(0, s * 0.7, s * 0.9, s * 0.18, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,200,0.15)';
        ctx.beginPath(); ctx.ellipse(0, 0, s * 1.3, s * 1.3, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        if (this.isWarning && !fleeing) { ctx.strokeStyle = 'rgba(255,200,0,0.6)'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.arc(0, bob, s * 1.45, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
        if (this.bug.draw) { this.bug.draw(ctx, s, bob, this); }
        if (fleeing) { ctx.strokeStyle = 'rgba(255,240,60,0.9)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, bob, s * 1.55, 0, Math.PI * 2); ctx.stroke(); for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; ctx.strokeStyle = 'rgba(255,255,120,0.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(Math.cos(a) * s * 1.6, Math.sin(a) * s * 1.6 + bob); ctx.lineTo(Math.cos(a) * s * 2.2, Math.sin(a) * s * 2.2 + bob); ctx.stroke(); } }
        ctx.restore();
    }

    squish() {
        if (!this.alive) return; this.alive = false;
        for (let i = 0; i < 18; i++) { particles.push({ x: this.x, y: this.y, vx: (Math.random() - 0.5) * 9, vy: (Math.random() - 0.5) * 7 - 2, life: 1, color: this.isWarning ? '#FFD040' : '#8B6914', size: 2 + Math.random() * 5, isSplat: i < 5 }); }
        killed++; kc.textContent = killed; combo++; comboTimer = 40; comboEl.textContent = combo > 1 ? combo + 'x' : '0';
        setTimeout(() => { bugs = bugs.filter(b => b !== this); const tot = errorTarget + warningTarget; while (bugs.length < tot) bugs.push(new Bug(undefined, bugs.length >= errorTarget)); updateCountDisplay(); }, 400);
        try { vscode.postMessage({ command: 'bugKilled', points: this.isWarning ? 5 : 10 }); } catch (e) {}
    }
    contains(px, py) { return Math.abs(px - this.x) < this.size * 1.5 && Math.abs(py - this.y) < this.size * 1.5; }
}

// ============================================================
// BACKGROUND THEMES
// ============================================================
function drawEnv() {
    switch (currentBackground) {
        case 'mud': drawMudBackground(); break;
        case 'grass': drawGrassBackground(); break;
        case 'night': drawNightBackground(); break;
        case 'desert': drawDesertBackground(); break;
        case 'ocean': drawOceanBackground(); break;
        case 'space': drawSpaceBackground(); break;
        default: drawMudBackground();
    }
}

function drawMudBackground() {
    const t = frame * 0.005;
    const mud = ctx.createLinearGradient(0, 0, 0, H);
    mud.addColorStop(0, '#7A5C3A'); mud.addColorStop(0.3, '#8B6B48');
    mud.addColorStop(0.6, '#6B4F28'); mud.addColorStop(1, '#4A3508');
    ctx.fillStyle = mud; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 20; i++) {
        const dx = (Math.sin(i * 3.7 + t * 0.4) * 0.5 + 0.5) * W;
        const dy = (Math.cos(i * 5.1 + t * 0.3) * 0.5 + 0.5) * H;
        ctx.fillStyle = `rgba(180,150,100,${0.1 + Math.sin(i + t * 2) * 0.06})`;
        ctx.beginPath(); ctx.arc(dx, dy, 2, 0, Math.PI * 2); ctx.fill();
    }
}

function drawGrassBackground() {
    const t = frame * 0.005;
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#87CEEB'); sky.addColorStop(0.6, '#B0E57C'); sky.addColorStop(1, '#4A8C2A');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 60; i++) {
        const gx = (i / 60) * W; const gh = 15 + Math.sin(i * 3) * 20;
        const sway = Math.sin(t * 0.8 + i) * gh * 0.3;
        ctx.strokeStyle = `rgba(${40 + i % 30},${100 + i % 40},${20 + i % 20},0.6)`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(gx, H); ctx.lineTo(gx + sway, H - gh); ctx.stroke();
    }
    for (let i = 0; i < 15; i++) {
        const px = (Math.sin(i * 2.5 + t * 0.3) * 0.5 + 0.5) * W;
        const py = (Math.cos(i * 3.5 + t * 0.4) * 0.5 + 0.5) * H;
        ctx.fillStyle = 'rgba(255,255,150,0.3)';
        ctx.beginPath(); ctx.arc(px, py, 1.5, 0, Math.PI * 2); ctx.fill();
    }
}

function drawNightBackground() {
    const t = frame * 0.005;
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#0a0a2e'); sky.addColorStop(0.5, '#1a1a3e'); sky.addColorStop(1, '#0d1b2a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 80; i++) {
        const sx = (Math.sin(i * 13.7) * 0.5 + 0.5) * W;
        const sy = (Math.cos(i * 17.3) * 0.5 + 0.5) * H * 0.7;
        const twinkle = 0.3 + Math.sin(t * 2 + i) * 0.4;
        ctx.fillStyle = `rgba(255,255,220,${twinkle})`;
        ctx.beginPath(); ctx.arc(sx, sy, 0.5 + Math.abs(Math.sin(t + i)) * 1.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#FFEECC';
    ctx.beginPath(); ctx.arc(W * 0.8, H * 0.2, 35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0a0a2e';
    ctx.beginPath(); ctx.arc(W * 0.82, H * 0.18, 30, 0, Math.PI * 2); ctx.fill();
}

function drawDesertBackground() {
    const t = frame * 0.005;
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#FF8C42'); sky.addColorStop(0.4, '#FFB347'); sky.addColorStop(1, '#F5DEB3');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#E8C872';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let i = 0; i <= W; i += 20) { ctx.lineTo(i, H * 0.5 + Math.sin(i * 0.01 + t) * 30); }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    for (let i = 0; i < 25; i++) {
        const sx = (Math.sin(i * 4.5 + t * 0.5) * 0.5 + 0.5) * W;
        const sy = H * 0.3 + (Math.cos(i * 3.5) * 0.5 + 0.5) * H * 0.5;
        ctx.fillStyle = 'rgba(210,180,140,0.3)';
        ctx.beginPath(); ctx.arc(sx, sy, 2, 0, Math.PI * 2); ctx.fill();
    }
}

function drawOceanBackground() {
    const t = frame * 0.005;
    const ocean = ctx.createLinearGradient(0, 0, 0, H);
    ocean.addColorStop(0, '#006994'); ocean.addColorStop(0.3, '#004466'); ocean.addColorStop(1, '#001a33');
    ctx.fillStyle = ocean; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 8; i++) {
        const rx = W * (0.1 + i * 0.1);
        ctx.fillStyle = `rgba(100,180,255,${0.03 + Math.sin(t + i) * 0.02})`;
        ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx + 30, H); ctx.lineTo(rx - 20, H); ctx.closePath(); ctx.fill();
    }
    for (let i = 0; i < 20; i++) {
        const bx = (Math.sin(i * 3.2 + t * 0.2) * 0.5 + 0.5) * W;
        const by = H - ((frame * 0.2 + i * 40) % H);
        ctx.fillStyle = 'rgba(150,220,255,0.2)';
        ctx.beginPath(); ctx.arc(bx, by, 2 + Math.sin(i + t) * 1.5, 0, Math.PI * 2); ctx.fill();
    }
}

function drawSpaceBackground() {
    const t = frame * 0.005;
    const space = ctx.createLinearGradient(0, 0, 0, H);
    space.addColorStop(0, '#000011'); space.addColorStop(0.5, '#0a0a2a'); space.addColorStop(1, '#050510');
    ctx.fillStyle = space; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 120; i++) {
        const sx = (Math.sin(i * 7.7 + i * i * 0.1) * 0.5 + 0.5) * W;
        const sy = (Math.cos(i * 11.3 + i * i * 0.05) * 0.5 + 0.5) * H;
        const twinkle = 0.3 + Math.sin(t * 3 + i) * 0.5;
        ctx.fillStyle = `rgba(255,255,255,${twinkle})`;
        ctx.beginPath(); ctx.arc(sx, sy, 0.3 + Math.abs(Math.sin(t * 2 + i)) * 1.2, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = 0; i < 4; i++) {
        const nx = W * (0.2 + i * 0.2);
        const ny = H * (0.3 + i * 0.1);
        const ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, 100);
        ng.addColorStop(0, `rgba(${100 + i * 30},${50 + i * 20},${200 - i * 30},0.08)`);
        ng.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = ng;
        ctx.beginPath(); ctx.arc(nx, ny, 100, 0, Math.PI * 2); ctx.fill();
    }
}

function updateParticles(){for(let p of particles){p.x+=p.vx;p.y+=p.vy;if(!p.isSplat)p.vy+=0.1;p.life-=0.025}particles=particles.filter(p=>p.life>0)}
function drawParticles(){for(let p of particles){ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;if(p.isSplat){ctx.beginPath();ctx.ellipse(p.x,p.y,p.size*2,p.size*.5,0,0,Math.PI*2);ctx.fill()}else{ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.restore()}}
function updateCountDisplay(){errCountEl.textContent=errorTarget;warnCountEl.textContent=warningTarget}
function setTargets(errors,warnings){errorTarget=errors;warningTarget=warnings;const tot=errors+warnings;bugs=bugs.filter(b=>b.alive);while(bugs.length>tot){const b=bugs.pop();if(b)b.alive=false}while(bugs.length<tot)bugs.push(new Bug(undefined,bugs.length>=errors));updateCountDisplay()}
function gameLoop(){frame++;if(comboTimer>0){comboTimer--;if(!comboTimer){combo=0;comboEl.textContent='0'}}updateParticles();ctx.clearRect(0,0,W,H);drawEnv();for(let b of bugs){b.update();b.draw(ctx)}drawParticles();requestAnimationFrame(gameLoop)}
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;for(let i=bugs.length-1;i>=0;i--){if(bugs[i].alive&&bugs[i].contains(mx,my)){bugs[i].squish();break}}});
window.addEventListener('message',e=>{if(e.data.command==='setTargets')setTargets(e.data.errors,e.data.warnings)});
resize();
try{const vscode=acquireVsCodeApi();vscode.postMessage({command:'ready'});}catch(e){}
gameLoop();
</script>
</body>
</html>
